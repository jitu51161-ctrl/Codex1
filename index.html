<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word of the Day</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1b1b1f;
      }

      main {
        text-align: center;
        padding: 2.5rem 3rem;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0 0 2rem;
        font-size: 1.1rem;
        max-width: 32ch;
      }

      button {
        border: none;
        background: #2f5cff;
        color: #ffffff;
        font-size: 1rem;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(47, 92, 255, 0.3);
      }

      button:focus-visible {
        outline: 3px solid rgba(47, 92, 255, 0.4);
        outline-offset: 3px;
      }

      .controls {
        display: inline-flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="word">Serenity</h1>
      <p id="meaning">A calm, peaceful state of mind and atmosphere.</p>
      <div class="controls">
        <button id="play-audio" type="button">Play audio</button>
        <button id="next-word" type="button">Next word</button>
      </div>
    </main>

    <script>
      const words = [
        {
          word: "Serenity",
          meaning: "A calm, peaceful state of mind and atmosphere.",
        },
        {
          word: "Luminous",
          meaning: "Giving off light or glowing brightly.",
        },
        {
          word: "Curious",
          meaning: "Eager to know or learn something.",
        },
        {
          word: "Gratitude",
          meaning: "The quality of being thankful or appreciative.",
        },
      ];

      let currentIndex = 0;

      const wordElement = document.querySelector("#word");
      const meaningElement = document.querySelector("#meaning");
      const playButton = document.querySelector("#play-audio");
      const nextButton = document.querySelector("#next-word");

      const renderWord = () => {
        const current = words[currentIndex];
        wordElement.textContent = current.word;
        meaningElement.textContent = current.meaning;
      };

      const speakWord = () => {
        const current = words[currentIndex];
        const utterance = new SpeechSynthesisUtterance(
          `${current.word}. ${current.meaning}`
        );
        utterance.lang = "en-US";
        utterance.rate = 0.95;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      };

      const showNextWord = () => {
        currentIndex = (currentIndex + 1) % words.length;
        renderWord();
      };

      playButton.addEventListener("click", speakWord);
      nextButton.addEventListener("click", showNextWord);

      renderWord();
    </script>
  </body>
</html>
